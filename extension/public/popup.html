<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenTint</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --text: #10131A;
      --text-secondary: #6c757d;
      --border: #e9ecef;
      --primary: #635BFF;
      --teal: #22D3C5;
      --pink: #FF6B9D;
      --focus: #635BFF;
    }

    [data-theme="dark"] {
      --bg: #10131A;
      --bg-secondary: #1a1d26;
      --text: #ffffff;
      --text-secondary: #a8adb7;
      --border: #2a2d36;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
